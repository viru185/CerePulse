name: CI

on:
  push:
    # dev is where development happens and where betas are cut from, so it has to be as
    # well tested as main — a broken dev means a broken beta.
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # windows-latest is required: PySide6 and the Windows Credential Manager backend
    # only import on Windows, and this app ships for Windows only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q -m "not live"

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

  package:
    # Proves the installer and portable zip still build, on main and on demand. Without
    # this the packaging is only ever exercised during a release, which is the worst
    # possible moment to discover it is broken.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Install InnoSetup
        run: choco install innosetup --no-progress -y

      - name: Build
        run: uv run python tools/build_all.py --clean

      - name: Check both artifacts exist
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Get-ChildItem dist -Filter *-Setup.exe)) { $missing += "installer" }
          if (-not (Get-ChildItem dist -Filter *-portable.zip)) { $missing += "portable zip" }
          if ($missing) { Write-Error "Not produced: $($missing -join ', ')"; exit 1 }
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Smoke-test the built executable without a console
        shell: pwsh
        timeout-minutes: 3
        # Start-Process detaches the process, so it gets no inherited console and Python
        # sets sys.stdout/stderr to None — the state a user gets when double-clicking, and
        # the one that shipped a crash-on-launch in 0.1.0. `paths` runs the same startup
        # path as the GUI and then exits, so this works on a runner with no desktop.
        #
        # The wait is bounded rather than open-ended: PyInstaller reports an unhandled
        # exception in a *modal dialog*, so a plain -Wait blocks forever on the very
        # failure this step exists to catch.
        run: |
          $env:CEREPULSE_DATA_DIR = "$env:TEMP\smoke"
          $p = Start-Process -FilePath "dist\CerePulse\CerePulse.exe" `
                             -ArgumentList "paths" -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            Write-Error "Windowed launch hung for 60s — most likely a crash dialog."
            exit 1
          }
          if ($p.ExitCode -ne 0) {
            Write-Error "Windowed launch failed with exit code $($p.ExitCode)"
            Get-ChildItem "$env:CEREPULSE_DATA_DIR\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName -Tail 30 }
            exit 1
          }
          Write-Host "Windowed launch OK"

      - uses: actions/upload-artifact@v4
        with:
          name: cerepulse-dev-build
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
          retention-days: 7
