     time and defaults to In Process, so its presence is what tells an empty grid apart from
     a page that never loaded. -->

<body>

    <option selected="selected" value="In Process">In Process</option>

    <option value="Approved">Approved</option>
    <option value="Lapsed">Lapsed</option>
    <option value="History">History</option>

  <table id="ctl00_BodyContentPlaceHolder_GridView1">

      <th></th><th>Edit</th><th>For Date</th><th>Mode</th><th>In time</th><th>Out time</th>
      <th>Remark</th><th>Approve Date</th><th>Status</th><th>Type</th><th>Swipe Category</th>
