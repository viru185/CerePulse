# Portal credentials for the `cerepulse capture` development tool.
#
# Copy this file to `.secrets.toml` and fill in your own SpineHR credentials.
# `.secrets.toml` is gitignored and must never be committed.
#
# The capture tool is the only thing that reads this; the desktop app itself stores
# your password in the Windows Credential Manager instead.

[portal]
username = "YOUR_EMPLOYEE_ID"
password = "YOUR_PASSWORD"
