<!-- S3 — Watch. The stopwatch crown gives the mark an outline that is recognisable before
     any detail resolves, which is what carries an icon at 16px. Hands at six, two-tone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect class="tile" x="0" y="0" width="256" height="256" rx="58" fill="#0E0E10"/>
  <g fill="#22D3EE">
    <rect x="108" y="20" width="40" height="20" rx="10"/>
    <rect x="119" y="36" width="18" height="22"/>
  </g>
  <circle cx="128" cy="146" r="82" fill="none" stroke="#22D3EE" stroke-width="22"/>
  <path d="M 128 146 V 82" fill="none" stroke="#22D3EE" stroke-width="16" stroke-linecap="round"/>
  <path d="M 128 146 V 196" fill="none" stroke="#F59E0B" stroke-width="24" stroke-linecap="round"/>
  <circle cx="128" cy="146" r="14" fill="#F59E0B"/>
</svg>
