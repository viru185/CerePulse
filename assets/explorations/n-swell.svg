<!-- N — Swell. The pulse as a single smooth wave rather than a medical trace: one rise, one
     fall, drawn as a solid tapered ribbon that thins to a point at both ends. It is a shape
     rather than a line, which is what lets it hold at any size and in any single colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect class="tile" x="0" y="0" width="256" height="256" rx="58" fill="#0E0E10"/>
  <!-- Outward edge left to right, then the return edge right to left, closing the ribbon.
       The offset between them is widest at the centre, which is what tapers the ends. -->
  <path class="mark"
        d="M 24 150
           C 60 150, 66 74, 110 74
           C 154 74, 166 182, 206 182
           C 222 182, 228 166, 232 152
           C 226 186, 214 208, 194 208
           C 148 208, 140 100, 110 100
           C 80 100, 74 176, 42 176
           C 32 176, 26 166, 24 150 Z"
        fill="#22D3EE"/>
</svg>
