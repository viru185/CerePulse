<!-- L — Hourglass. Time running down, with the falling sand drawn as a heartbeat. The most
     literal reading of "how much of my day is left". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0E0E10"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#1F1F23" stroke-width="4"/>

  <!-- Caps. -->
  <path d="M 72 52 H 184" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 72 204 H 184" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round"/>

  <!-- The glass, pinched at the waist. -->
  <path d="M 84 52 V 88 L 128 128 L 172 88 V 52" fill="none" stroke="url(#g)" stroke-width="18"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 84 204 V 168 L 128 128 L 172 168 V 204" fill="none" stroke="url(#g)" stroke-width="18"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- The sand, falling as a pulse. -->
  <path d="M 128 96 L 116 128 L 140 152 L 128 176"
        fill="none" stroke="#F59E0B" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
