<!-- J2 — Hand. The pulse is the clock's only hand: one stroke leaving the hub, beating
     once, and running out to the hour mark. Fuses the two ideas into a single gesture
     instead of layering one over the other. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect class="tile" x="0" y="0" width="256" height="256" rx="58" fill="#0E0E10"/>
  <g fill="none" stroke="#22D3EE" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="128" r="84" stroke-width="24"/>
    <path d="M 128 128 H 150 L 163 94 L 180 162 L 190 128" stroke-width="21"/>
  </g>
  <circle cx="128" cy="128" r="13" fill="#22D3EE"/>
</svg>
