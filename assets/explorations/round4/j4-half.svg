<!-- J4 — Half. The beat completes the circle: the top is a clock's arc, and where the
     bottom arc would be, the pulse runs instead. One continuous contour, so the two ideas
     are literally the same line rather than two overlaid shapes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect class="tile" x="0" y="0" width="256" height="256" rx="58" fill="#0E0E10"/>
  <path class="mark"
        d="M 42 130 A 86 86 0 0 1 214 130
           H 176 L 158 178 L 130 74 L 108 154 L 92 130 Z"
        fill="none" stroke="#22D3EE" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
