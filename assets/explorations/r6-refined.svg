<!-- R6 — Six, refined. The other attempts failed for one reason: a bare vertical line inside
     a circle reads as a letter, not as hands. Three things fix it — a visible hub, an hour
     hand that is both shorter *and* heavier than the minute hand, and a tick at twelve to
     anchor the dial. The C opening and the stopwatch crown keep the name and the object. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect class="tile" x="0" y="0" width="256" height="256" rx="58" fill="#0E0E10"/>

  <!-- Crown, so the silhouette is a watch rather than a ring. -->
  <g fill="#22D3EE">
    <rect x="108" y="20" width="40" height="20" rx="10"/>
    <rect x="119" y="36" width="18" height="20"/>
  </g>

  <g fill="none" stroke="#22D3EE" stroke-linecap="round" stroke-linejoin="round">
    <!-- The face, opened on the right into a C. -->
    <path d="M 196 96 A 82 82 0 1 0 196 196" stroke-width="24"/>
    <!-- Twelve, to anchor the dial. -->
    <path d="M 128 68 V 84" stroke-width="16"/>
    <!-- Minute hand: long, light, to twelve. -->
    <path d="M 128 146 V 92" stroke-width="16"/>
    <!-- Hour hand: short, heavy, to six. -->
    <path d="M 128 146 V 190" stroke-width="26"/>
  </g>
  <circle cx="128" cy="146" r="15" fill="#22D3EE"/>
</svg>
